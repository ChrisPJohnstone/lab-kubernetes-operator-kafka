apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.lab.com # Must be {plural}.{group}
spec:
  group: lab.com
  names:
    kind: KafkaTopic
    singular: kafkatopic
    plural: kafkatopics
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - partitions
                - replicationFactor
              properties:
                name:
                  type: string
                partitions:
                  type: integer
                replicationFactor:
                  type: integer
